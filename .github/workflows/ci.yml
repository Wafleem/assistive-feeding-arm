name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Headless software rendering so the camera/perception sim tests run too.
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for offscreen rendering
        run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyopengl
      - name: Unit tests (no MuJoCo)
        run: python -m pytest -q --ignore=tests/test_sim.py
      - name: MuJoCo end-to-end tests
        run: python -m pytest -q -rs tests/test_sim.py
