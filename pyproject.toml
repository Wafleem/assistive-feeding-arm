[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistive-arm"
version = "0.1.0"
description = "Assisted eating with an xArm6: mouth tracking, open-vocabulary food perception, gentle grasping, safe feeding motion, LLM routing; MuJoCo sim, Viam on hardware"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
sim = ["mujoco>=3.1"]
dev = ["pytest>=8", "mujoco>=3.1", "pillow"]
viam = ["viam-sdk>=0.40"]
vision = ["torch", "transformers>=4.44", "pillow"]
# Install a CUDA build of torch/torchvision appropriate to the Jetson first.
vision-preview = ["rfdetr==1.11.2", "mediapipe==1.1.1", "pillow", "opencv-contrib-python", "viam-sdk==0.85.0"]
# Optional cloud LLM backends for the language layer (the default is a local model; tests never need these)
llm-cloud = ["anthropic", "openai"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sim: needs mujoco (skipped if not installed)"]
