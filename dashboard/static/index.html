<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Servo Dashboard</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e6e8ee; --dim:#9aa3b2;
          --accent:#4ea1ff; --ok:#3ccf7a; --warn:#ffb020; --bad:#ff4d4f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .pill { padding:2px 10px; border-radius:999px; background:var(--line); font-size:12px; }
  .pill.busy { background:var(--warn); color:#000; } .pill.done { background:var(--ok); color:#000; }
  main { display:grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr); gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .video img { width:100%; border-radius:6px; background:#000; aspect-ratio: 4/3; object-fit: contain; }
  #stop { width:100%; padding:18px; font-size:20px; font-weight:700; background:var(--bad); color:#fff;
          border:0; border-radius:10px; cursor:pointer; margin-bottom:12px; }
  #stop:active { transform: scale(0.99); }
  .steps { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  button.step { padding:10px; border-radius:8px; border:1px solid var(--line); background:#222734; color:var(--text);
                cursor:pointer; text-align:left; }
  button.step:hover { border-color:var(--accent); }
  button.step b { color:var(--accent); margin-right:6px; }
  button.step.danger { border-color:#5a3a1a; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:14px 0 8px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric: tabular-nums; }
  td { padding:3px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  td:first-child { color:var(--dim); width:44%; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=number] { width:80px; background:#0c0e12; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  label.chk { display:flex; gap:6px; align-items:center; color:var(--warn); margin:8px 0; }
  #log { max-height:220px; overflow:auto; font:12px ui-monospace, monospace; }
  #log div { padding:2px 0; border-bottom:1px solid #1f232c; }
  #msg { min-height:20px; color:var(--warn); margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>Face servo</h1>
  <span id="mode" class="pill">connecting…</span>
  <span id="reason" style="color:var(--dim)"></span>
  <span style="margin-left:auto;color:var(--dim)" id="fps"></span>
</header>
<main>
  <section class="card video">
    <img id="cam" alt="gripper camera">
    <div style="color:var(--dim);font-size:12px;margin-top:6px">
      Cyan cross = where the spoon points (tolerance circle). Red dot = lips. Arrow = centring error (green when centred).
    </div>
  </section>
  <section>
    <div class="card">
      <button id="stop">STOP</button>
      <div class="row" style="margin-bottom:8px">
        <button class="step" data-a="teleop_start">Teleop on</button>
        <button class="step" data-a="teleop_stop">Teleop off</button>
      </div>
      <h2>Teach (with teleop on)</h2>
      <div class="steps">
        <button class="step" data-a="teach_look"><b>1</b>Teach look</button>
        <button class="step" data-a="teach_near"><b>2</b>Teach near</button>
      </div>
      <h2>Run</h2>
      <div class="steps">
        <button class="step" data-a="sweep"><b>3</b>Sweep to person</button>
        <button class="step" data-a="find_face"><b>4</b>Find face</button>
        <button class="step" data-a="calibrate"><b>5</b>Calibrate (hold still)</button>
        <button class="step" data-a="center"><b>6</b>Center on face</button>
        <button class="step danger" data-a="extend" id="extend"><b>7</b>Extend toward face</button>
        <button class="step" data-a="retreat">Retreat to look</button>
      </div>
      <label class="chk"><input type="checkbox" id="consent"> The person is ready, can move away, and someone is watching STOP</label>
      <div class="row">
        Stop distance <input type="number" id="stopcm" min="3" step="1"> cm
        Speed <input type="number" id="speed" min="12" max="60" step="1"> °/s
        <button class="step" id="apply">Apply</button>
      </div>
      <div id="msg"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2 style="margin-top:0">Face</h2><table id="face"></table>
      <h2>Arm</h2><table id="arm"></table>
      <h2>Log</h2><div id="log"></div>
    </div>
  </section>
</main>
<script>
const token = new URLSearchParams(location.search).get("token") || "";
document.getElementById("cam").src = "/stream.mjpg?token=" + encodeURIComponent(token);
const $ = id => document.getElementById(id);
let paramsLoaded = false;

async function cmd(action, extra = {}) {
  $("msg").textContent = "";
  try {
    const r = await fetch("/api/cmd", { method: "POST", headers: { "Content-Type": "application/json", "X-Token": token },
                                        body: JSON.stringify({ action, ...extra }) });
    const j = await r.json();
    if (!j.ok) $("msg").textContent = j.error || "failed";
  } catch (e) { $("msg").textContent = "no connection to the dashboard server"; }
}

document.querySelectorAll("button[data-a]").forEach(b => b.onclick = () => {
  const a = b.dataset.a;
  if (a === "extend" && !$("consent").checked) { $("msg").textContent = "Tick the readiness box before Extend."; return; }
  cmd(a);
});
$("stop").onclick = () => cmd("stop");
document.addEventListener("keydown", e => { if (e.code === "Space" || e.code === "Escape") { e.preventDefault(); cmd("stop"); } });
$("apply").onclick = () => cmd("set_params", { stop_tip_distance: $("stopcm").value / 100, joint_speed_degs: $("speed").value });

function rows(el, obj) {
  el.innerHTML = Object.entries(obj).map(([k, v]) =>
    `<tr><td>${k}</td><td>${Array.isArray(v) ? v.join(", ") : (v === null || v === undefined ? "—" : v)}</td></tr>`).join("");
}

async function poll() {
  try {
    const r = await fetch("/api/state", { headers: { "X-Token": token } });
    const s = await r.json();
    $("mode").textContent = s.mode;
    $("mode").className = "pill " + (s.mode === "idle" ? "" : s.mode === "done" ? "done" : "busy");
    $("reason").textContent = s.reason;
    $("fps").textContent = s.fps + " fps";
    const f = s.face || {};
    rows($("face"), {
      "lips error (px)": f.error_px, "camera → lips": f.camera_distance_cm != null ? f.camera_distance_cm + " cm" : null,
      "spoon tip → lips": f.tip_distance_cm != null ? f.tip_distance_cm + " cm" : null,
      "facing camera": f.frontalness, "mouth": f.open == null ? null : (f.open ? "open" : "closed") + ` (${f.open_ratio})`,
      "head speed": f.speed_cm_s != null ? f.speed_cm_s + " cm/s" : null, "fix age": f.age_s != null ? f.age_s + " s" : null,
      "mouth (base, mm)": f.position_mm,
    });
    rows($("arm"), {
      "joints (deg)": s.joints, "look pose": s.taught.look, "near pose": s.taught.near,
      "calibrated": s.taught.calibrated ? "yes" : "no",
      "path progress s": s.servo ? s.servo.s : null, "offset pan/flex (deg)": s.servo ? s.servo.offset_deg : null,
      "stop distance": s.params.stop_tip_distance_cm + " cm (floor " + s.params.floor_cm + ")",
      "speed cap": s.params.joint_speed_degs + " °/s",
    });
    if (!paramsLoaded) { $("stopcm").value = s.params.stop_tip_distance_cm; $("speed").value = s.params.joint_speed_degs; paramsLoaded = true; }
    $("log").innerHTML = s.log.map(e => `<div>${e.t} <b>${e.kind}</b> ${e.msg}</div>`).join("");
  } catch (e) { $("mode").textContent = "disconnected"; }
  setTimeout(poll, 300);
}
poll();
</script>
</body>
</html>
